{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Login</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>
    </form>
</div>
{% endblock %}
