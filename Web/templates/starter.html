{% extends "base.html" %}

{% block title %}Choose Your Starter{% endblock %}

{% block content %}
<div class="card">
    <h1>Choose Your Starter</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="starter-grid">
        <form method="post">
            <input
                type="hidden"
                name="species_id"
                value="bulbasaur"
            >
            <button class="starter-button" type="submit">
                <img
                    src="{{ url_for(
                        'static',
                        filename='sprites/bulbasaur.png'
                    ) }}"
                    alt="Bulbasaur"
                >
                <span>Bulbasaur</span>
            </button>
        </form>

        <form method="post">
            <input
                type="hidden"
                name="species_id"
                value="charmander"
            >
            <button class="starter-button" type="submit">
                <img
                    src="{{ url_for(
                        'static',
                        filename='sprites/charmander.png'
                    ) }}"
                    alt="Charmander"
                >
                <span>Charmander</span>
            </button>
        </form>

        <form method="post">
            <input
                type="hidden"
                name="species_id"
                value="squirtle"
            >
            <button class="starter-button" type="submit">
                <img
                    src="{{ url_for(
                        'static',
                        filename='sprites/squirtle.png'
                    ) }}"
                    alt="Squirtle"
                >
                <span>Squirtle</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
